<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herbert Parasio · SQA Team Lead</title>
<meta name="description" content="SQA Team Lead at BMM Testlabs. My team verifies casino and slot games against the math model and the rules of 10 jurisdictions.">
<link rel="alternate" hreflang="en" href="https://herbertph.com/">
<link rel="alternate" hreflang="pt" href="https://herbertph.com/?lang=pt">
<link rel="alternate" hreflang="es" href="https://herbertph.com/?lang=es">
<link rel="alternate" hreflang="fr" href="https://herbertph.com/?lang=fr">
<meta property="og:type" content="website">
<meta property="og:url" content="https://herbertph.com/">
<meta property="og:title" content="Herbert Parasio · SQA Team Lead">
<meta property="og:description" content="SQA Team Lead at BMM Testlabs. My team verifies casino and slot games against the math model and the rules of 10 jurisdictions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E7; --paper-2:#EFE7D8;
    --ink:#17130B; --ink-soft:#4A4234; --ink-faint:#7A6F5C;
    --line:#DCD0BA; --line-strong:#B9A888;
    --green:#1C4D2E; --green-bright:#2E7D46; --green-deep:#10281A;
    --brick:#BC4B1F; --brick-soft:#F3D9C8; --gold:#C79A3B;
    --card:#FFFDF7; --panel:#17130B; --panel-ink:#F2EBDA; --panel-faint:#A99F88;
    --pass-bg:#1C4D2E;
    --shadow:0 18px 40px rgba(23, 19, 11, .10);
    --radius:14px;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    --wrap:1140px;
    --hud:58px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14110B; --paper-2:#1B1710;
      --ink:#F0E9D8; --ink-soft:#C9BFA9; --ink-faint:#948A74;
      --line:#332C1E; --line-strong:#55492F;
      --green:#7FC493; --green-bright:#9AD6AC; --green-deep:#0C1F13;
      --brick:#E88A5F; --brick-soft:#3A2317; --gold:#D9B45F;
      --card:#1E1A12; --panel:#0D0B07; --panel-ink:#F2EBDA; --panel-faint:#8E8471;
      --pass-bg:#1E5C36;
      --shadow:0 18px 40px rgba(0, 0, 0, .45);
    }
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:clamp(15px,.55vw + 13px,17px);line-height:1.62;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.08;margin:0;text-wrap:balance}
  p{margin:0}
  a{color:inherit}
  ul,ol{list-style:none;margin:0;padding:0}
  ::selection{background:var(--gold);color:#17130B}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(20px,5vw,48px)}
  .kicker{
    font-family:var(--mono);font-size:clamp(10px,.7vw + 8px,11px);font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:var(--brick);
  }
  .sec-head{max-width:74ch;margin-bottom:clamp(28px,4vw,48px)}
  .sec-head h2{font-size:clamp(28px,3.6vw,46px);margin-top:14px}
  .sec-head .lead{margin-top:16px;color:var(--ink-soft);font-size:clamp(16px,1.1vw + 13px,19px)}

  a:focus-visible,button:focus-visible{outline:2px solid var(--brick);outline-offset:3px;border-radius:2px}
  .cta:focus-visible{outline-color:var(--ink)}
  .facade:focus-visible{outline-color:var(--gold);outline-offset:-6px}

  /* ---------- HUD ---------- */
  .hud{position:fixed;inset:0 0 auto;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
  .hud-in{
    max-width:var(--wrap);margin:0 auto;height:var(--hud);
    padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
  }
  .hud-id{
    font-family:var(--mono);font-size:clamp(9px,.5vw + 7.6px,10.5px);font-weight:500;
    letter-spacing:.1em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  }
  .hud-id:hover{color:var(--brick)}
  .hud-progress{display:flex;align-items:center;gap:10px;flex:1;min-width:0;max-width:280px}
  .track{flex:1;min-width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .track > span{display:block;width:0;height:100%;background:var(--green-bright);transition:width .35s ease}
  .hud-count{
    font-family:var(--mono);font-size:clamp(9px,.4vw + 8px,10.5px);letter-spacing:.08em;
    color:var(--ink-soft);white-space:nowrap;
  }
  .hud-count.done{color:var(--green-bright);font-weight:500}
  .hud-nav{display:flex;gap:clamp(9px,1.3vw,18px);margin-left:auto}
  .hud-nav a{
    font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;padding:6px 1px;border-bottom:1px solid transparent;
  }
  .hud-nav a:hover{color:var(--ink);border-bottom-color:var(--brick)}
  .langs{display:flex;gap:2px;flex:0 0 auto}
  .langs button{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    background:none;border:1px solid transparent;color:var(--ink-soft);
    min-width:26px;min-height:26px;display:inline-flex;align-items:center;justify-content:center;
    padding:5px 5px;line-height:1;cursor:pointer;
  }
  .langs button:hover{color:var(--ink)}
  .langs button[aria-current="true"]{color:var(--ink);border-color:var(--line-strong);background:var(--paper-2)}

  /* ---------- Hero ---------- */
  main{padding-top:var(--hud)}
  section{padding:clamp(52px,8vw,104px) 0;border-bottom:1px solid var(--line);scroll-margin-top:var(--hud)}
  .hero{padding:clamp(40px,6vw,84px) 0 clamp(48px,6.5vw,84px)}
  .hero-grid{
    display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);
    gap:clamp(28px,4vw,56px);align-items:start;
  }
  .hero .kicker{color:var(--ink-faint)}
  .hero h1{font-size:clamp(34px,3.2vw + 14px,60px);margin:14px 0 20px;max-width:20ch}
  .hero .lede{color:var(--ink-soft);font-size:clamp(16px,1.1vw + 13px,19px);max-width:54ch}
  .hero .cue{
    margin-top:clamp(24px,3vw,34px);font-family:var(--mono);font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--brick);
  }
  .sub-label{
    margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--ink-faint);
  }

  /* ---------- herbert.spec.ts panel ---------- */
  .spec{
    background:var(--panel);color:var(--panel-ink);border:1px solid var(--ink);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  }
  .spec-head{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:13px 18px;border-bottom:1px solid rgba(242,235,218,.14);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--panel-faint);
  }
  .spec-head .file{color:var(--panel-ink);font-size:12px;letter-spacing:.01em;text-transform:none}
  .spec-list{padding:7px 0}
  .spec-item{
    display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:start;
    padding:9px 18px;border-left:2px solid transparent;
    font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--panel-faint);
  }
  .spec-mark{font-weight:600}
  .spec-item.pending .spec-mark::before{content:"·"}
  .spec-item.pending.current .spec-mark::before{content:"▸";color:var(--gold)}
  .spec-item.passed{color:var(--panel-ink)}
  .spec-item.passed .spec-mark{color:var(--green-bright)}
  .spec-item.passed .spec-mark::before{content:"✓"}
  .spec-item.current{background:rgba(199,154,59,.12);border-left-color:var(--gold);color:var(--panel-ink)}
  .spec-foot{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 18px;border-top:1px solid rgba(242,235,218,.14);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--panel-faint);
  }
  .spec.done #specStatus{color:var(--green-bright)}
  #specCheck{color:var(--green-bright);font-weight:600}
  @media (prefers-color-scheme: dark){
    .spec{border-color:var(--line-strong)}
  }

  /* ---------- Story ---------- */
  .story-body{position:relative;padding-left:clamp(22px,4vw,48px)}
  .spine{position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--line);border-radius:2px}
  #spineProgress{display:block;width:100%;height:0;background:var(--brick);border-radius:2px}
  .chapter{
    padding:clamp(22px,3.4vw,40px) 0;border-top:1px solid var(--line);
    opacity:.4;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;
  }
  .chapter:first-child{border-top:0;padding-top:0}
  .chapter.in{opacity:1;transform:none}
  .chapter h3{font-size:clamp(22px,2.2vw,31px);margin:10px 0 12px;max-width:30ch}
  .chapter .ch-body{color:var(--ink-soft);max-width:66ch}
  .chapter .ch-line{
    margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--ink-faint);line-height:1.7;
  }
  .chapter .ch-line .k{color:var(--brick);letter-spacing:.12em;text-transform:uppercase}
  .chapter-dark{
    margin:clamp(18px,3vw,36px) 0;padding:clamp(26px,4vw,48px);
    background:var(--green-deep);color:var(--panel-ink);border:0;border-radius:var(--radius);
  }
  .chapter-dark h3{color:var(--panel-ink)}
  .chapter-dark .ch-body{color:#CFC7B3}
  .chapter-dark .kicker{color:var(--gold)}
  .chapter-dark .ch-line{color:var(--panel-faint)}
  .chapter-dark .ch-line .k{color:var(--gold)}

  /* ---------- Method ---------- */
  .steps{border-top:1px solid var(--line)}
  .step{
    display:grid;grid-template-columns:120px minmax(0,1fr);gap:clamp(14px,3vw,40px);
    padding:clamp(18px,2.4vw,26px) 0;border-bottom:1px solid var(--line);
  }
  .step-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brick);padding-top:7px}
  .step h3{font-size:clamp(20px,1.8vw,26px);margin-bottom:8px}
  .step p{color:var(--ink-soft);max-width:64ch}
  .callout{
    margin-top:clamp(28px,4vw,44px);padding:clamp(20px,3vw,30px);
    background:var(--brick-soft);border-left:3px solid var(--brick);
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .callout h3{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--brick);margin-bottom:10px}
  .callout p{max-width:88ch}

  /* ---------- Evidence ---------- */
  .metrics{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  }
  .metric{background:var(--card);padding:clamp(16px,2.2vw,28px)}
  .metric .num{display:block;font-family:var(--serif);font-weight:600;color:var(--green);font-size:clamp(32px,3.4vw,54px);line-height:1}
  .metric .lbl{
    display:block;margin-top:12px;font-family:var(--mono);font-size:10px;line-height:1.6;
    letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  }
  .ev-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px);margin-top:clamp(26px,3.6vw,44px)}
  .ev-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,2.4vw,30px);box-shadow:var(--shadow)}
  .ev-card .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brick);margin-bottom:10px}
  .ev-card h3{font-size:clamp(21px,1.8vw,26px);margin-bottom:10px}
  .ev-card p{color:var(--ink-soft)}
  .toolbox{margin-top:clamp(34px,4.6vw,60px);padding-top:clamp(22px,3vw,32px);border-top:1px solid var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chips li{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);
    border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;background:var(--card);
  }

  /* ---------- Showcase ---------- */
  #showcase{background:var(--paper-2)}
  .show-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,4.5vw,64px);align-items:start}
  .player{
    background:var(--green-deep);border-top:3px solid var(--gold);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .facade{
    display:grid;grid-template-rows:auto 1fr auto;gap:clamp(14px,2vw,24px);
    aspect-ratio:16/9;padding:clamp(18px,3vw,38px);text-decoration:none;color:var(--panel-ink);
    background:
      radial-gradient(120% 90% at 12% 8%,rgba(199,154,59,.16),rgba(199,154,59,0) 55%),
      linear-gradient(155deg,#12301F 0%,var(--green-deep) 58%,#0B1D13 100%);
    transition:filter .25s ease;
  }
  .facade:hover{filter:brightness(1.08)}
  .facade-top{
    font-family:var(--mono);font-size:clamp(9px,.5vw + 7.4px,11px);letter-spacing:.18em;
    text-transform:uppercase;color:var(--gold);
  }
  .facade-mid{display:flex;align-items:center;gap:clamp(12px,2vw,22px);min-width:0}
  .facade-play{
    flex:0 0 auto;display:grid;place-items:center;width:clamp(42px,5vw,60px);height:clamp(42px,5vw,60px);
    border:1px solid rgba(242,235,218,.5);border-radius:50%;font-size:clamp(13px,1.4vw,17px);
    color:var(--panel-ink);padding-left:3px;
  }
  .facade:hover .facade-play{border-color:var(--gold);color:var(--gold)}
  .facade-word{
    font-family:var(--serif);font-style:italic;font-weight:500;
    font-size:clamp(44px,7.4vw,96px);line-height:.9;letter-spacing:-.03em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;
  }
  .facade-bottom{
    font-family:var(--mono);font-size:clamp(9px,.5vw + 7.4px,11px);letter-spacing:.16em;
    text-transform:uppercase;color:var(--panel-faint);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .player-caption{
    margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .video-embed{position:relative;aspect-ratio:16/9;background:#000}
  .video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .show-copy .kicker{margin-bottom:12px;letter-spacing:.1em;text-wrap:balance}
  .show-copy h2{font-size:clamp(28px,3.2vw,42px);margin-bottom:14px}
  .show-copy .lead{color:var(--ink-soft);font-size:clamp(16px,1vw + 13px,18px)}
  .player-desc{margin-top:14px;color:var(--ink-soft);font-size:clamp(14px,.6vw + 12px,16px)}
  .agents{
    margin-top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-faint);line-height:2;
  }
  .agents .k{color:var(--brick);letter-spacing:.12em}
  .blocks{margin-top:clamp(22px,3vw,30px);border-top:1px solid var(--line)}
  .blocks li{padding:16px 0;border-bottom:1px solid var(--line)}
  .blocks .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brick)}
  .blocks h3{font-size:clamp(19px,1.7vw,24px);margin:6px 0 6px}
  .blocks p{color:var(--ink-soft);font-size:clamp(14px,.5vw + 12px,16px)}
  blockquote{
    margin:clamp(22px,3vw,30px) 0 0;padding-left:18px;border-left:2px solid var(--gold);
    font-family:var(--serif);font-size:clamp(18px,1.5vw,22px);line-height:1.5;color:var(--ink);
  }
  .cta{
    display:inline-block;margin-top:clamp(22px,3vw,30px);font-family:var(--mono);font-size:12px;
    letter-spacing:.06em;text-decoration:none;color:var(--paper);background:var(--brick);
    padding:12px 18px;border-radius:6px;
  }
  .cta:hover{background:var(--ink);color:var(--paper)}

  /* ---------- Next ---------- */
  .next-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.6vw,32px)}
  .next-item{border-top:2px solid var(--line-strong);padding-top:16px}
  .next-item .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brick)}
  .next-item h3{font-size:clamp(20px,1.8vw,26px);margin:10px 0 8px}
  .next-item p{color:var(--ink-soft);font-size:clamp(14px,.5vw + 12px,16px)}

  /* ---------- Sign-off ---------- */
  #signoff{border-bottom:0;background:var(--paper)}
  .pass-card{
    position:relative;background:var(--pass-bg);color:#F4EFE0;
    border-radius:calc(var(--radius) + 4px);padding:clamp(26px,4.6vw,60px);
    box-shadow:var(--shadow),inset 0 0 0 1px rgba(244,239,224,.16);
  }
  .stamp{
    display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.24em;
    border:2px solid currentColor;border-radius:6px;padding:9px 16px;margin-bottom:clamp(20px,3vw,28px);
    background:rgba(244,239,224,.07);
    transform:rotate(-3deg) scale(.96);transform-origin:left center;
    visibility:hidden;opacity:0;transition:opacity .5s ease,transform .5s ease;
  }
  .pass-card.visible .stamp{visibility:visible;opacity:1;transform:rotate(-3deg) scale(1)}
  .pass-card h2{font-size:clamp(27px,3.4vw,44px);max-width:26ch;margin-bottom:16px;color:#FBF7EC}
  .pass-body{max-width:66ch;color:rgba(244,239,224,.86)}
  .pass-links{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;
    margin-top:clamp(24px,3.6vw,40px);background:rgba(244,239,224,.24);
  }
  .pass-links li{display:flex}
  .pass-links a{
    display:flex;align-items:center;flex:1;min-width:0;padding:15px 16px;
    background:var(--pass-bg);text-decoration:none;overflow-wrap:anywhere;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;color:#F4EFE0;
  }
  .pass-links a:hover{background:rgba(0,0,0,.16);color:#FFFFFF}
  .pass-card a:focus-visible{outline-color:var(--gold)}
  .site-foot{
    margin-top:clamp(30px,4.5vw,52px);padding-top:20px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;line-height:1.9;color:var(--ink-faint);
  }

  /* ---------- Breakpoints ---------- */
  @media (min-width:921px){
    .show-player{position:sticky;top:calc(var(--hud) + 20px)}
  }
  @media (max-width:1180px){
    .hero h1{max-width:20ch}
  }
  @media (max-width:1000px){
    .hud-nav{display:none}
    .hud-progress{max-width:240px}
    .langs{margin-left:auto}
  }
  @media (max-width:920px){
    .show-grid{grid-template-columns:1fr}
    .show-player{order:-1}
  }
  @media (max-width:900px){
    .hero-grid{grid-template-columns:1fr}
    .hero h1{max-width:24ch}
    .spec{max-width:620px}
  }
  @media (max-width:860px){
    .ev-grid{grid-template-columns:1fr}
    .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
    .metric:nth-child(4),.metric:nth-child(5){grid-column:auto}
    .pass-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:760px){
    .next-grid{grid-template-columns:1fr}
    .step{grid-template-columns:1fr;gap:6px}
    .step-num{padding-top:0}
  }
  @media (max-width:720px){
    section{padding:clamp(44px,7vw,64px) 0}
  }
  @media (max-width:640px){
    .hud-progress{flex:0 0 auto}
    .track{display:none}
    .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}

  var SUPPORTED = ["en", "pt", "es", "fr"];
  var TOTAL = 7;

  var spec = document.getElementById("spec");
  var specList = document.getElementById("specList");
  var specStatus = document.getElementById("specStatus");
  var specCheck = document.getElementById("specCheck");
  var progressBar = document.getElementById("progress");
  var progressFill = document.getElementById("progressFill");
  var runCount = document.getElementById("runCount");
  var langsNav = document.getElementById("langs");
  var story = document.getElementById("story");
  var spineFill = document.getElementById("spineProgress");
  var chapters = Array.prototype.slice.call(document.querySelectorAll("[data-chapter]"));
  var evidence = document.getElementById("evidence");
  var nextSec = document.getElementById("next");
  var passCard = document.getElementById("passCard");

  var passed = [false, false, false, false, false, false, false];
  var passedCount = 0;
  var current = "en";
  var started = false;

  function renderRun(){
    progressBar.setAttribute("aria-valuenow", String(passedCount));
    progressFill.style.width = (passedCount / TOTAL * 100) + "%";
    runCount.textContent = passedCount ? passedCount + " / 7 PASSED" : "RUN 0/7";
    runCount.classList.toggle("done", passedCount === TOTAL);
    spec.classList.toggle("done", passedCount === TOTAL);
    specStatus.textContent = passedCount === TOTAL ? T[current].statusPassing : T[current].statusRunning;
    specCheck.textContent = passedCount === TOTAL ? "✓" : "";
  }

  function mark(n){
    if (passed[n - 1]) return;
    passed[n - 1] = true;
    passedCount++;
    var item = specList.querySelector('[data-test="' + n + '"]');
    if (item){
      item.classList.remove("pending");
      item.classList.add("passed");
      item.dataset.state = "passed";
    }
    renderRun();
  }

  function setMeta(selector, value){
    var el = document.querySelector(selector);
    if (el) el.setAttribute("content", value);
  }

  function apply(code){
    var d = T[code] || T.en;
    current = T[code] ? code : "en";
    document.documentElement.lang = current;
    document.title = d.title;
    setMeta('meta[name="description"]', d.desc);
    setMeta('meta[property="og:title"]', d.title);
    setMeta('meta[property="og:description"]', d.desc);
    langsNav.setAttribute("aria-label", d.langLabel);
    progressBar.setAttribute("aria-label", d.progressLabel);

    document.querySelectorAll("[data-i]").forEach(function(el){
      var v = d[el.dataset.i];
      if (typeof v === "string") el.textContent = v;
    });
    document.querySelectorAll("[data-ihtml]").forEach(function(el){
      var v = d[el.dataset.ihtml];
      if (typeof v === "string") el.innerHTML = v;
    });

    renderRun();

    document.querySelectorAll("#langs button").forEach(function(b){
      b.setAttribute("aria-current", String(b.dataset.lang === current));
    });

    var url = new URL(window.location.href);
    if (current === "en") url.searchParams.delete("lang");
    else url.searchParams.set("lang", current);
    history.replaceState(null, "", url.pathname + url.search);
  }

  function updateSpine(){
    var r = story.getBoundingClientRect();
    if (!r.height) return;
    var progress = (window.innerHeight * 0.55 - r.top) / r.height;
    progress = Math.min(Math.max(progress, 0), 1);
    spineFill.style.height = (progress * 100) + "%";
  }

  // Geometry catch-up: a jump straight to the bottom must still mark every test.
  function syncFromViewport(){
    var vh = window.innerHeight;
    chapters.forEach(function(ch, i){
      var r = ch.getBoundingClientRect();
      if (r.top < vh * 0.72){
        ch.classList.add("in");
        mark(i + 1);
      }
    });
    if (evidence.getBoundingClientRect().top < vh * 0.7) mark(6);
    if (nextSec.getBoundingClientRect().top < vh * 0.7) mark(7);
    if (passCard.getBoundingClientRect().top < vh * 0.7) passCard.classList.add("visible");
  }

  var ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      started = true;
      syncFromViewport();
      updateSpine();
    });
  }

  if ("IntersectionObserver" in window){
    var chapterObserver = new IntersectionObserver(function(entries){
      if (!started) return;
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        entry.target.classList.add("in");
        mark(Number(entry.target.dataset.chapter) + 1);
      });
      updateSpine();
    }, { threshold: 0.28 });
    chapters.forEach(function(ch){ chapterObserver.observe(ch); });

    var sectionObserver = new IntersectionObserver(function(entries){
      if (!started) return;
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        if (entry.target === evidence) mark(6);
        if (entry.target === nextSec) mark(7);
        if (entry.target === passCard) passCard.classList.add("visible");
      });
    }, { threshold: 0.3 });
    [evidence, nextSec, passCard].forEach(function(el){ sectionObserver.observe(el); });
  }

  document.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);

  langsNav.addEventListener("click", function(e){
    var button = e.target.closest("button[data-lang]");
    if (button) apply(button.dataset.lang);
  });

  var facade = document.getElementById("videoFacade");
  var player = document.getElementById("videoPlayer");
  var overrideId = window.UNFLAKY_VIDEO_ID;
  var videoId = (typeof overrideId === "string" && overrideId) ? overrideId : UNFLAKY_VIDEO_ID;

  if (videoId){
    facade.addEventListener("click", function(e){
      e.preventDefault();
      var frame = document.createElement("div");
      frame.className = "video-embed";
      var iframe = document.createElement("iframe");
      iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId) + "?autoplay=1";
      iframe.title = "Unflaky tool walkthrough";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      frame.appendChild(iframe);
      player.replaceChild(frame, facade);
    });
  }

  var requested = new URLSearchParams(window.location.search).get("lang");
  apply(SUPPORTED.indexOf(requested) > -1 ? requested : "en");
  // A fresh load at the top opens at 0/7. Only a real scroll (or a restored
  // mid-page position) starts the run and catches up with what is on screen.
  if (window.scrollY > 0){
    started = true;
    syncFromViewport();
  }
  updateSpine();
})();
</script>
